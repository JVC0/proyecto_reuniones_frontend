name: PR to Trello
on:
  pull_request:
    types: [opened, reopened]

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Attach PR to card
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          ID=$(echo "$BRANCH" | sed -nE 's#^[^/]+/([A-Za-z0-9]{8})-.*#\1#p')
          if [ -n "$ID" ]; then
            curl -sf -X POST "https://api.trello.com/1/cards/$ID/attachments" \
              --data-urlencode "key=$TRELLO_KEY" \
              --data-urlencode "token=$TRELLO_TOKEN" \
              --data-urlencode "url=$PR_URL" \
              --data-urlencode "name=PR: $PR_TITLE"
          else
            echo "No Trello card ID in branch name, skipping."
          fi