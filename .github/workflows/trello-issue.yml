name: PR to Trello
on:
  pull_request:
    types: [opened, reopened]

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Attach PR to card
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          NUM=$(echo "$BRANCH" | sed -nE 's#^([0-9]+)-.*#\1#p')
          if [ -z "$NUM" ]; then
            echo "Branch does not start with an issue number, skipping."
            exit 0
          fi

          ID=$(gh issue view "$NUM" --repo "$REPO" --json comments \
            --jq '.comments[].body' | grep -oE 'trello\.com/c/[A-Za-z0-9]{8}' | head -n1 | cut -d/ -f3)
          if [ -z "$ID" ]; then
            echo "No Trello card link found on issue #$NUM, skipping."
            exit 0
          fi

          OUT=$(curl -s -w "\n%{http_code}" -X POST "https://api.trello.com/1/cards/$ID/attachments" \
            --data-urlencode "key=$TRELLO_KEY" \
            --data-urlencode "token=$TRELLO_TOKEN" \
            --data-urlencode "url=$PR_URL" \
            --data-urlencode "name=PR: $PR_TITLE")
          CODE=$(echo "$OUT" | tail -n1)
          if [ "$CODE" -ge 400 ]; then
            echo "Trello returned $CODE: $(echo "$OUT" | sed '$d')"
            exit 1
          fi
          echo "PR attached to card $ID."